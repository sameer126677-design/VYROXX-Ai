name: VYROXX AI CI

on:
  push:
    branches:
      - phase1/claude-model-routing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyroxx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build and TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production app
        run: npm run build
